name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Устанавливаем Flutter (чтобы Flet не пытался его скачивать с подтверждением)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # Стабильная версия Flutter
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2. Выполняем сборку
      - name: Build Flet App for Windows
        run: flet build windows

      # 3. Выгружаем готовый результат
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: pcb-auto-excel-windows
          path: build/windows/
