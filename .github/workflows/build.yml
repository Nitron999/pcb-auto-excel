name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем правильную версию Flutter (выше 3.24.0, как просит Flet)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Кодировка UTF-8 оставлена, чтобы зеленые галочки не ломали консоль
      - name: Build Flet App for Windows
        env:
          PYTHONIOENCODING: utf-8
        run: flet build windows

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: pcb-auto-excel-windows
          path: build/windows/
